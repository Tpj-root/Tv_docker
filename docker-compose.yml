services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env                 # DERIV_APP_ID, DERIV_API_TOKEN, DERIV_ACCOUNT_ID
    volumes:
      - ./backend:/app       # code edits (and config.py) reload the backend
      - ./data:/app/data     # trade CSV files appear in tv-app/data on your PC

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # keep the container's node_modules
    depends_on:
      - backend
