services:
  backend:
    build: ./backend
    ports:
      - "8088:8088"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keeps container's node_modules, not your host's
    depends_on:
      - backend